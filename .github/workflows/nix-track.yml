name: Track upstream release

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Read the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/jdx/fnox/releases/latest)"
          version="$(jq -r '.tag_name | ltrimstr("v")' <<<"$release")"
          current="$(jq -r .version nix/release.json)"
          # A re-run upstream can move "latest" back to an older tag; never follow it down.
          if [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "Keeping ${current}: upstream latest is ${version}."
            exit 0
          fi
          # Releases listed in "skip" are known broken here; stay put until a newer one ships.
          if jq -e --arg v "$version" '.skip // [] | index($v)' nix/release.json >/dev/null; then
            echo "Keeping ${current}: ${version} is in skip."
            exit 0
          fi
          digest="$(jq -r '.assets[] | select(.name == "fnox-x86_64-unknown-linux-gnu.tar.gz") | .digest' <<<"$release")"
          hash="$(nix hash convert --hash-algo sha256 --to sri "${digest#sha256:}")"
          jq --arg version "$version" --arg hash "$hash" '.version = $version | .hash = $hash' nix/release.json > nix/release.json.new
          mv nix/release.json.new nix/release.json

      # A wrong hash or a library the package does not provide stops here, before the commit.
      - name: Build
        run: nix build .#fnox --no-link

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet nix/release.json; then
            echo "Already at the latest release."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898583+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(nix): update to $(jq -r .version nix/release.json)" nix/release.json
          git push origin HEAD:nix
